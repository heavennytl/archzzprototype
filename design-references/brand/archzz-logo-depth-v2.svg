<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <style>
      .label { font: 600 15px Arial, Helvetica, sans-serif; letter-spacing: 1.4px; fill: #151515; }
      .small { font: 500 13px Arial, Helvetica, sans-serif; fill: #625f5a; }
      .nav { font: 600 13px Arial, Helvetica, sans-serif; fill: #151515; }
      .rule { stroke: #d8d3cc; stroke-width: 1; }
    </style>

    <!--
      Single reusable signature:
      1) an 80%-scale uppercase Z creates the lead-in rhythm;
      2) fixed breathing room surrounds the red spatial plane;
      3) uppercase Z closes the name at ARCH cap height.
    -->
    <symbol id="zz-depth-mark" viewBox="0 0 253 110">
      <!-- First uppercase Z: exactly 80% of cap height, aligned to the common baseline. -->
      <path fill="currentColor" transform="translate(0 22) scale(.8)"
            d="M0 0H115V20L38 90H110V110H0V90L77 20H0Z"/>
      <!-- Fixed white breathing room: 16 units on both sides. -->
      <path fill="#8F1818" d="M108 46L122 38V94L108 102Z"/>
      <!-- Uppercase Z: same cap height and baseline as ARCH. -->
      <path fill="currentColor" transform="translate(138 0)"
            d="M0 0H115V20L38 90H110V110H0V90L77 20H0Z"/>
    </symbol>

    <symbol id="archzz-depth-wordmark" viewBox="0 0 590 100">
      <text x="0" y="88" textLength="380" lengthAdjust="spacingAndGlyphs"
            font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="700"
            fill="currentColor">ARCH</text>
      <!-- Both uppercase Zs share the ARCH baseline; final Z matches its cap height. -->
      <use href="#zz-depth-mark" x="395" y="6" width="188.6" height="82"/>
    </symbol>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#151515" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="#F7F5F1"/>

  <text class="label" x="64" y="58">CASE STUDY V4 · 80% UPPERCASE Z + RED SPACE + CAP-HEIGHT Z</text>
  <line class="rule" x1="64" y1="74" x2="1472" y2="74"/>

  <line x1="82" y1="261.4" x2="956" y2="261.4" stroke="#B9B3AA" stroke-width="1" stroke-dasharray="5 6"/>
  <text class="small" x="962" y="266">SHARED BASELINE</text>
  <g color="#151515">
    <use href="#archzz-depth-wordmark" x="72" y="132" width="865" height="147"/>
  </g>

  <text class="label" x="1066" y="118">CONSTRUCTION</text>
  <rect x="1064" y="142" width="408" height="232" rx="4" fill="#FCFBF8" stroke="#D8D3CC"/>
  <g color="#151515">
    <use href="#zz-depth-mark" x="1112" y="184" width="310" height="154"/>
  </g>
  <line x1="1246" y1="158" x2="1246" y2="354" stroke="#8F1818" stroke-width="1" stroke-dasharray="5 5" opacity="0.4"/>
  <text class="small" x="1066" y="398">80% UPPERCASE Z · FIXED GAPS · CAP-HEIGHT Z</text>

  <line class="rule" x1="64" y1="438" x2="1472" y2="438"/>

  <text class="label" x="64" y="478">WEBSITE NAVIGATION</text>
  <g filter="url(#soft-shadow)">
    <rect x="64" y="500" width="1408" height="100" rx="5" fill="#FFFFFF"/>
  </g>
  <g color="#151515">
    <use href="#archzz-depth-wordmark" x="96" y="529" width="236" height="40"/>
  </g>
  <text class="nav" x="400" y="558">SketchUp Models</text>
  <text class="nav" x="570" y="558">3ds Max Models</text>
  <text class="nav" x="728" y="558">Today’s Free</text>
  <text class="nav" x="842" y="558">Pricing</text>
  <circle cx="1322" cy="550" r="9" fill="none" stroke="#151515" stroke-width="2"/>
  <line x1="1329" y1="557" x2="1336" y2="564" stroke="#151515" stroke-width="2"/>
  <path d="M1380 541h22l-2 18h-16z" fill="none" stroke="#151515" stroke-width="2"/>

  <text class="label" x="64" y="660">LIGHT</text>
  <text class="label" x="550" y="660">REVERSED</text>
  <text class="label" x="1036" y="660">STANDALONE SIGNATURE</text>

  <rect x="64" y="684" width="420" height="174" rx="5" fill="#FFFFFF" stroke="#D8D3CC"/>
  <g color="#151515">
    <use href="#archzz-depth-wordmark" x="104" y="739" width="340" height="58"/>
  </g>

  <rect x="550" y="684" width="420" height="174" rx="5" fill="#151515"/>
  <g color="#FFFFFF">
    <use href="#archzz-depth-wordmark" x="590" y="739" width="340" height="58"/>
  </g>

  <rect x="1036" y="684" width="436" height="174" rx="5" fill="#FFFFFF" stroke="#D8D3CC"/>
  <g color="#151515">
    <use href="#zz-depth-mark" x="1152" y="716" width="204" height="101"/>
  </g>

  <text class="label" x="64" y="908">BROWSER TAB + FAVICON SCALE TEST</text>
  <rect x="64" y="928" width="600" height="66" rx="16" fill="#EAE8E4"/>
  <rect x="92" y="940" width="42" height="42" rx="9" fill="#151515"/>
  <g color="#FFFFFF"><use href="#zz-depth-mark" x="98" y="947" width="30" height="15"/></g>
  <text x="154" y="969" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#151515">ARCHZZ — Professional 3D Models</text>

  <text class="small" x="790" y="940">16</text>
  <rect x="784" y="952" width="16" height="16" rx="3" fill="#151515"/>
  <g color="#FFFFFF"><use href="#zz-depth-mark" x="786" y="956" width="12" height="6"/></g>

  <text class="small" x="935" y="930">32</text>
  <rect x="926" y="942" width="32" height="32" rx="7" fill="#151515"/>
  <g color="#FFFFFF"><use href="#zz-depth-mark" x="931" y="950" width="22" height="11"/></g>

  <text class="small" x="1112" y="916">64</text>
  <rect x="1096" y="928" width="64" height="64" rx="14" fill="#151515"/>
  <g color="#FFFFFF"><use href="#zz-depth-mark" x="1106" y="945" width="44" height="22"/></g>

  <text class="small" x="1226" y="950">One reusable depth component</text>
  <text class="small" x="1226" y="971">across every application.</text>
</svg>
